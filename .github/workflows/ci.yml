name: CI

on:
  push:
    branches: [main, public]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -c constraints.txt -e ".[dev]"
      - name: Provision grammars
        run: python -c "from tree_sitter_language_pack import download; download(['python','javascript','typescript','tsx','csharp','cpp','go','rust','json','yaml','toml','markdown'])"
      - name: Test indexed default
        env:
          GITA_ENABLE_LEGACY: '0'
        run: python -m pytest tests/test_legacy_flag.py tests/test_index_query.py -q
      - name: Test legacy compatibility
        env:
          GITA_ENABLE_LEGACY: '1'
        run: python -m pytest -q
      - name: Verify indexed workflow
        run: python verify/check.py --stage f3

  index-qualification:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      GITA_ENABLE_LEGACY: '0'
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -c constraints.txt -e ".[dev,bench]"
      - name: Provision only fixture grammar before measurement
        run: python -c "from tree_sitter_language_pack import download; download(['python'])"
      - name: Qualification contracts and publication recovery
        run: python -m pytest tests/test_index_candidate_cache.py tests/test_index_qualification.py tests/test_index_reliability.py tests/test_index_oracle_gates.py -q --basetemp ../index-qualification-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: index-qualification-${{ matrix.os }}
          path: ../index-qualification-tests
          retention-days: 7