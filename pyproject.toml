[project]
name = "gita"
version = "0.1.0"
description = "Git-native semantic layer: structural diffs, symbol history, callers index, MCP server."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "libcst>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
gita = "gita.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gita"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
