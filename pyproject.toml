[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gita"
version = "0.1.0"
description = "git reimagined for a world of agent coders — context diffs, not line diffs"
requires-python = ">=3.11"
dependencies = [
    "tree-sitter>=0.25",
    "tree-sitter-language-pack>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "tiktoken>=0.7"]

[tool.hatch.build.targets.wheel]
packages = ["src/gita"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
