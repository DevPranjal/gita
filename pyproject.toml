[project]
name = "gitpp"
version = "0.1.0-dev"
description = "Agentic version control prototype: versioning logic, not text."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "libcst>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
gitpp = "gitpp.cli:main"
gita = "gita.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gitpp", "src/gita"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
