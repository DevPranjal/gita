  must_mention: [PDF, pdf.go]
  note: new renderer across five files

- id: ripgrep-index-flags
  repo: ripgrep
  base: 2ed0c00^
  head: 2ed0c00
  category: interface
  prompt: |
    What is being disabled, under what condition, and where is that decision
    made? Name the struct or file involved.
  must_mention: [LowArgs, hiargs.rs]
  note: Rust; the condition matters as much as the list

- id: got-searchparams-fix
  repo: got
  base: 5772bf2^
  head: 5772bf2
  category: review
  prompt: |
    What bug does this fix, and which setter is involved? Name it.
  must_mention: [searchParams, options.ts]
  note: TypeScript accessor pair; a getter/setter with the same name

- id: got-abort-signals
  repo: got
  base: 74e3167^
  head: 74e3167
  category: locate
  prompt: |
    Where are abort signals handled, and what changed about that handling?
